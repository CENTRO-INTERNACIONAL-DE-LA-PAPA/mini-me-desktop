# Two editions of one book, English and Spanish, built from this folder with Quarto profiles:
#
#   quarto render --profile en    → _book/en/
#   quarto render --profile es    → _book/es/
#
# A plain `quarto render` builds English. Settings shared by both live here; each edition's
# title, chapter list and output folder live in _quarto-en.yml and _quarto-es.yml. A Spanish
# page sits beside its English one as <name>.es.qmd, and both editions share images/.
#
# installing.qmd and first-time-setup.qmd are kept but left out of both editions for now
# (Mini-Me is installed in advance for workshop users), and have no Spanish version yet.
profile:
  default: en

project:
  type: book

book:
  author: "International Potato Center (CIP)"
  date: today
  search: true

format:
  html:
    # Light only: a single theme means Quarto shows no dark-mode toggle.
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: false
