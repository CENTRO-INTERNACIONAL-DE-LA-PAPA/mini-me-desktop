[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ty.environment]
python = ".venv"

[project]
name = "Mini-Me"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dabest>=2025.10.20",
    "deepagents[quickjs]>=0.6.0",
    "dotenv>=0.9.9",
    "fastmcp>=3.2.4",
    "flask-wtf>=1.3.0",
    "ipykernel>=7.2.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.1.14",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "langsmith>=0.8.4",
    "missingno>=0.5.2",
    "pins>=0.9.1",
    "pip>=26.0.1",
    "pointblank>=0.24.0",
    "preliz>=0.22.0",
    "pymc>=5.28.4",
    "pyjwt[crypto]>=2.10",
    "pypandoc-binary>=1.13",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "statsmodels>=0.14.6",
    "typst>=0.13.0",
    "umap-learn>=0.5.12",
    # Capped below 9: vault_store.py targets the 8.x KV vault API
    # (create_kv/get_name/update_kv/delete_kv/list_kv). The 7.x→8.x rename of
    # this API already broke prod once, so pin the major to avoid a silent repeat.
    "workos>=8.0.0,<9",
    "xgboost>=3.2.0",
    "langgraph-api>=0.12.6",
    "langgraph-sdk>=0.3.13",
    "asta",
]

[project.optional-dependencies]
dev = [
    "langgraph-cli[inmem]>=0.4.26",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["backend", "backend.middleware", "backend.routes"]

[tool.uv.sources]
asta = { path = "../asta-plugins", editable = true }
