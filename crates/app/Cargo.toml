[package]
name = "mini-me-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mini-me-desktop-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

# Local sidecar supervision + streaming.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"

# Protocol payloads (mirror the backend's run/stream shapes as they are needed).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Asta credentials are JWTs. Reading only their base64url `exp` claim lets startup reuse a
# seven-day token instead of forcing the CLI through a ten-second network refresh (§131/§145).
base64 = "0.22"

# Reading a Zed theme extension, which ships as a .tar.gz. Both are pure-Rust and tiny;
# `flate2`'s rust_backend keeps a C toolchain out of the build, which matters because a
# fresh `cargo build` on a colleague's Windows machine has to just work.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

# OS keychain for model/API keys instead of a plaintext dotfile. Native backends on
# Windows and macOS; on Linux the **zbus** Secret Service client (`async-secret-service`
# + `crypto-rust`) rather than the libdbus one, so building needs no `libdbus-1-dev` and
# no `pkg-config` — a `cargo build` on a fresh machine has to just work, and every system
# dependency we add is one more thing that can stop it.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "crypto-rust",
    "tokio",
] }

# `settings.toml` — the non-secret half of the configuration (see settings.rs).
toml = "0.8"

# Diagnostics.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Taking an update. Both are small and pure Rust, and `deflate-flate2` reuses the
# `flate2` above rather than vendoring a second compressor — two crates added in total.
#
# `zip` rather than shelling out to PowerShell's `Expand-Archive`, which would have cost
# no dependency at all. The deciding argument is §267: a Windows-only unpack path cannot
# be tested on the machine this is written on, and the two bugs that reached a release
# build that day were both in code no Linux run could reach.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
# GitHub publishes `digest: "sha256:…"` on every release asset, so a download can be
# checked against what was uploaded. 0.10 rather than 0.11 because 0.10 is already in
# this tree transitively; a second major version would compile a second copy.
sha2 = "0.10"

# Signalling the sidecar's whole process group on shutdown (see backend.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows has no process groups to signal, so the sidecar's tree is reaped with a **Job
# Object** instead (see `terminate` in backend.rs). Bindings only — no C, nothing to build.
#
# The three features are all load-bearing and were found by cross-checking, not guessed:
# `CreateJobObjectW` is gated behind Win32_Security (it takes SECURITY_ATTRIBUTES), and
# JOBOBJECT_EXTENDED_LIMIT_INFORMATION behind Win32_System_Threading.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
