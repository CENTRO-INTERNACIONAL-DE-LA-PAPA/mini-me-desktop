[package]
name = "mini-me-desktop-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mini-me-desktop-app"
path = "src/main.rs"

[dependencies]
# GPUI *is* published to crates.io — contrary to the P6.0 assumption. `gpui 0.2.2`
# (an Oct-2025 snapshot) is fully self-contained: its only companions, `gpui_macros`
# and `gpui_util`, are published too, and it has no `git`/`path` deps. It exposes the
# exact `Application::new().run()` / `open_window` / `Render` API this app targets
# (verified 2026-07-29 against gpui 0.2.2's own examples/hello_world.rs). Pinning the
# published crate instead of a Zed monorepo `git` rev retires risk R1 (unstable
# git dependency on an API-churning tree).
#
# Fallback, only if a newer API becomes necessary: the Zed monorepo at
#   rev = "00bd72e7838f4b875a913cd112b47a0ebe1ca62b"   # tag v1.13.1 (2026-07-29)
# — but note revs after ~mid-2025 move the entry point out of `gpui` into a separate
# `gpui_platform::application()` crate, so main.rs would need reconciling for that.
gpui = "=0.2.2"

# Local sidecar supervision + streaming.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"

# Protocol payloads (mirror the backend's run/stream shapes as they are needed).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS keychain for model/API keys instead of a plaintext dotfile.
keyring = "3"

# Grapheme-aware cursor movement in the composer (matches what gpui's own input
# example uses, so arrow keys/backspace don't split emoji or accented clusters).
unicode-segmentation = "1"

# Diagnostics.
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Signalling the sidecar's whole process group on shutdown (see backend.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
