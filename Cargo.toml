[workspace]
resolver = "2"
members = ["crates/app"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["CIP Mini-Me"]

# Zed/GPUI recommends aggressive optimization for dependencies even in dev so the
# UI stays responsive; keep the workspace's own crates cheap to iterate on.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
