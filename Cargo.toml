[workspace]
resolver = "2"
members = ["crates/app"]

[workspace.package]
# 0.1.0 is the first build handed to someone who did not write it. Not 1.0: WSL
# provisioning has never run on a clean Windows machine, and the executable is unsigned.
version = "0.3.2"
edition = "2021"
license = "MIT"
authors = ["CIP Mini-Me"]

# Zed/GPUI recommends aggressive optimization for dependencies even in dev so the
# UI stays responsive; keep the workspace's own crates cheap to iterate on.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
